<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÉLIXIR — Luxury Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <div class="login-card">

            <!-- LEFT SIDE -->
            <div class="left-side">

                <div class="glow-one"></div>
                <div class="glow-two"></div>

                <div class="left-content">

                    <div class="brand-name">
                        Élixir Parfums
                    </div>

                    <h1 class="eternal-title">
                        ETERNAL
                    </h1>

                    <p class="description">
                        A timeless fragrance crafted for unforgettable moments.
                    </p>

                    <!-- PERFUME BOTTLE -->
                    <div class="perfume-container">

                        <div class="bottle-cap"></div>

                        <div class="bottle-neck"></div>

                        <div class="bottle">

                            <div class="bottle-label">

                                <div class="bottle-label-title">
                                    ÉLIXIR
                                </div>

                                <div class="bottle-label-subtitle">
                                    PARFUM
                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="locations">
                        PARIS • MILANO • NEW YORK
                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="right-side">

                <div class="form-container">

                    <div class="text-center mb-4">

                        <div class="logo-circle">
                            <span>E</span>
                        </div>

                        <h2 class="welcome-title">
                            WELCOME BACK
                        </h2>

                        <p class="welcome-text">
                            Sign in to continue your fragrance journey.
                        </p>

                    </div>


                    <!-- ALERT -->
                    <div
                        id="alertFeedback"
                        class="alert-custom"
                        role="alert">
                    </div>


                    <!-- LOGIN FORM -->
                    <form id="loginForm" novalidate>

                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="name@example.com"
                                required>

                        </div>


                        <!-- PASSWORD -->
                        <div class="mb-3">

                            <div class="d-flex justify-content-between align-items-center mb-1">

                                <label
                                    for="password"
                                    class="form-label mb-0">
                                    Password
                                </label>

                                <a
                                    href="#"
                                    class="forgot-password"
                                    id="forgotPasswordBtn">
                                    Forgot Password?
                                </a>

                            </div>


                            <div class="input-group-custom">

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="••••••••"
                                    required>

                                <i
                                    class="bi bi-eye password-toggle"
                                    id="togglePassword">
                                </i>

                            </div>

                        </div>


                        <!-- REMEMBER -->
                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="remember">

                            <label
                                class="form-check-label remember-text"
                                for="remember">
                                Remember me
                            </label>

                        </div>


                        <!-- SIGN IN -->
                        <button
                            type="submit"
                            class="login-btn">
                            SIGN IN
                        </button>

                    </form>


                    <!-- DIVIDER -->
                    <div class="divider">

                        <div class="divider-line"></div>

                        <span class="divider-text">
                            OR
                        </span>

                        <div class="divider-line"></div>

                    </div>


                    <!-- GOOGLE -->
                    <button
                        type="button"
                        class="google-btn"
                        id="googleBtn">

                        <svg width="16" height="16" viewBox="0 0 24 24">

                            <path
                                fill="#EA4335"
                                d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>

                            <path
                                fill="#4285F4"
                                d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>

                            <path
                                fill="#FBBC05"
                                d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-1.9z"/>

                            <path
                                fill="#34A853"
                                d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>

                        </svg>

                        <span>
                            Continue with Google
                        </span>

                    </button>


                    <!-- SIGN UP -->
                    <p class="text-center signup-text">

                        Don't have an account?

                        <a
                            href="#"
                            class="signup-link"
                            id="signupBtn">
                            Create Account
                        </a>

                    </p>


                    <!-- FOOTER -->
                    <p class="text-center footer-text">
                        © 2026 ÉLIXIR PARFUMS
                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>
</html>
